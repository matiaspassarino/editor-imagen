[project]
name = "editor-imagen"
version = "0.1.0"
description = "Editor masivo de imágenes de producto — Industrias Sur"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "pillow-heif",
    "opencv-python-headless",
    "imagehash",
    "spandrel",
    "transformers",
    "timm",
    "kornia",
    "einops",
    "huggingface-hub",
    "typer",
    "rich",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
rembg = ["rembg[gpu]"]
ui = ["gradio"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
editor = "editor_imagen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editor_imagen"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
