# config.yaml — ver docs/SDD.md §12
biblioteca: "C:/imagenes editadas"
fuentes:                       # carpetas a unificar (recursivo)
  - "C:/Users/Usuario Ventas/Desktop/FOTOS PRODCUTOS"
dedup:
  phash_umbral: 4

proceso:
  segmentacion:
    modelo: combinado          # combinado (dynamic + dis) | birefnet | birefnet-dynamic | birefnet-dis
    usar_transparencia_existente: true   # fotos que ya vienen sin fondo: se respeta su recorte
    quitar_reflejo: false      # para todas: da falsos positivos. Mejor por foto: `reflejo` en la columna ajustes
    rellenar_placas: true      # huecos con piezas adentro (placa blanca con LEDs) se rellenan
    quitar_sombra: true
    refinar_bordes: true
  restauracion:
    artefactos_jpeg: true
    ruido: 0.3
  upscale:
    modo: conservative         # conservative | standard | off
  mejora:
    balance_blancos: true
    contraste: 0.3
    nitidez: 0.3
  salida:
    tamano: 1080
    margen: 0.04
    dpi: 300
